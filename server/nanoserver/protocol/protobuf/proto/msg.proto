//回合制
message TurnBasedBattle{
    message TBBuff{
        int32 Id = 1;
        int32 Round = 2; //剩余轮数
        int32 Rate    = 3; //触发概率
        int64 OwnerUid = 4; //拥有者
        repeated Stats Attr = 5;
        int64 Shield = 6; //护盾量
    }

    message TBSkill{
        int32 Id = 1;
        int32 CD = 2;
        int32 AdvancedLevel = 3;
    }

    message TBObject{
        enum ObState{
            NORMAL = 0;
            DEAD = 1;
        }
        ObjectType  Type 		    = 1;
        int64    	Uid             = 2;
        int32	 	CfgID 		    = 3;
        int32  		Level 		    = 4;
        string   	Name		    = 5;
        int32 		MaxHp 		    = 8;
        int32   	CurHp 		    = 9;
        ObState   	State 		    = 10;
        int32       Job             = 11;
        repeated TBBuff Buffs 	    = 12;
	    repeated Stats Attr         = 13;
        repeated TBSkill Skills     = 14;
        int32       Position        = 15; //站位
        ActionCamp Camp             = 16; //阵营
        int32   Gender              = 17; //性别
    }

    message TBPlayer{
        int64    	Uid             = 1;
        int32  		Level 		    = 2;
        string   	Name		    = 3;
        repeated TBObject Objs 	= 4;
    }

    enum ActionCamp{
        INVALID_CAMP = 0;
        BLUE_CAMP = 1;
        RED_CAMP = 2;
    }
    message Round{
        message Effect{
            int64 TargetUid     = 1;
            int32 Damage        = 2;
            int32 Recover       = 3;
            repeated int32 Addbuffs = 4;
            bool Dead = 5;
            bool Crit = 6;
            bool Miss = 7; //miss
            bool Reflect = 8; // 反伤
            bool Revive = 9; //复活
        }
        int32 RoundId       = 1; // 回合ID
        int32 ActionType    = 2; // 行动类型
        int64 Uid           = 3; // 行动者ID
        int32 SkillId       = 4; // 技能ID
        repeated Effect Effects = 5; // 效果列表
        repeated TBObject BlueStats = 6; // 蓝方状态
        repeated TBObject RedStats  = 7; // 红方状态
        ActionCamp ActionCamp = 8; // 行动方
        int32 ActionNum    = 9; // 行动次数
    }

    message TBResult{
        bool Win = 1;
        repeated ItemInfo Items = 2; // 奖励物品列表
        int32 Score = 3; // 积分
    }

    TBPlayer Blue = 1;
    TBPlayer Red = 2;
    repeated Round Rounds = 3; // 回合列表
    TBResult Result = 4; // 战斗结果
    TBPlayer OriginBlue = 5; // 原始蓝方
    TBPlayer OriginRed = 6; // 原始红方
    int64 MatchTime = 7; // 比赛时间
}

