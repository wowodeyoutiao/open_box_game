syntax = "proto3";

option go_package = "../pb";

package pb;

import "common.proto";

//通用返回
message CommonResponse {
    int32  Code = 1;
    string Error = 2;
    uint32  RequestCmdId = 3; //该操作对应的请求ID
}

// 登录 id: C2S_Login
message LoginToGameServerRequest {
    string Name = 1;
    int64 Uid = 2;
    string HeadUrl = 3;
    string Token = 4;
}
message LoginToGameServerResponse {
    int32  Code = 1;
    string Error = 2;

    string Name = 3;
    int64  Uid = 4;
    string HeadUrl = 5;
    int64  Timestamp = 6;
    int32   GameStatus = 7;  //1空闲， 2游戏中
}

//同步角色基础信息 S2C_SyncUserBase
message SyncUserBasePush{
    int64       Uid         = 1;
    int64       Coin        = 2;    // 金币	游戏内的通用货币
    int64       Diamanta    = 3;    // 血玉	游戏内的兑换货币，对应钻石
    int64       Coupon      = 4;    // 点券	游戏内的充值货币，对应点券
    int64       Energy      = 5;    // 体力	进入副本消耗
    int32       Vip         = 6;
	int64       Exp         = 7;    // 经验
	int32       Level       = 8;    // 等级
    int32       EnergyRecoveryTime = 9;// 下次体力恢复剩余时间(秒)
    int32       Combat      = 10;   // 战斗力
    int64       VipExp      = 11;   //VIP累计经验
    int64       Soul        = 12;   //战魂  PVP货币
    int32       FateLevel   = 13;   //命格等级
    int64       FateExp     = 14;   //命格经验
    int64       TrialVoucher = 15;  //试炼凭证
    int64       TreasuerBox = 16;   //宝箱数量
    int64       HomeAFK = 17;   //首页挂机时间
    int64       PetExp = 18;   //宠物经验
    int64       BoxQuick = 19;   //加速卷轴
    int64       GuildId = 20; //工会Id
    int64       GuildContribution = 21; //工会经验
    int64       GuildWish = 22; //工会许愿点
    int32       WishRecoveryTime =23;// 下次许愿点恢复剩余时间(秒)
}

//同步角色属性 S2C_SyncUserStats
message SyncUserStatsPush {
    message PartnerStats{
        int32       Combat = 1; // 战斗力
    	repeated Stats Attributes = 2;
        int64 PartnerUid = 3; // 伙伴Uid
    }
    int32       TotalCombat = 1; // 总战斗力
    int32       Combat = 2; // 主角战斗力
    repeated Stats Attributes = 3; //主角属性
    repeated PartnerStats Partners = 4; //伙伴属性
}

// 同步角色高级属性 S2C_SyncUserAdvanceInfo
message  SyncUserAdvanceInfoPush{
    repeated SkillInfo Skills = 1;
    repeated SlotInfo Equips = 2; //穿戴装备,未穿槽位null
    repeated TaskInfo Tasks = 3; //任务
    repeated int32 SkillsSlot = 4;
    repeated int32 Guidance = 5;
    AutoDisassemblyInfo AutoDisassembly = 6;
    Userbox Box = 7;
    repeated int64 TurnBasedUids = 8; // 回合制上阵uid列表 长度固定为6， 未出战的位置
}

// 同步角色技能槽位 S2C_SyncUserSkillSlot
message  SyncUserSkillSlotPush{
    repeated int32 SkillsSlot = 1;
}
// 同步角色装备信息 S2C_SyncUserEquipsInfo
message  SyncUserEquipsInfoPush{
    repeated SlotInfo Equips = 1; //穿戴装备,未穿槽位null
}
// 同步宠物信息
message  SyncUserPetInfoPush{
    repeated PetSlotInfo Pet = 1;
    int32 PetRecoveryTime = 2;
    repeated int32 PetEverHave = 3;
    int32 PetBuy =4;

}
// 同步宝箱属性 S2C_SyncUserBoxInfo
message  SyncUserBoxInfoPush{
    Userbox Box = 1;
}

// 同步伙伴信息 S2C_SyncPartnerListPush
message SyncPartnerListPush{
    repeated PartnerInfo List = 1;
}


//加入游戏  C2S_Join
message JoinDeskRequest{
    int32 RoomId = 1; // 房间ID
    int32 BattleId = 2; // 副本ID(battle表ID, 没有则为0)
}
message JoinDeskResponse{
    int32  Code = 1;
    string Error = 2;
    TableInfo TableInfo = 3;
    Point Location = 4;
    Direction Direction = 5;
    int64 LeftTime = 6; // 剩余时间
}


// 退出房间  C2S_Exit
message ExitRequest{}

message ExitResponse{
    int32  Code = 1;
    string Error = 2;
}
// 退出房间广播  S2C_PlayerExit
message ExitPush{
    int64 Uid = 1;
    int32 Code = 2; // 1 副本时间到， 2 死亡复活超时, 3 怪死光
}

//桌子玩家信息信息同步  S2C_PlayerEnter
message PlayerEnterDeskPush{
    repeated  PlayerInfo  Data= 1;
}

//移动  C2S_Move
message MoveRequest{
    Point Location = 1;
}
message MoveResponse{
    int32  Code     = 1;
    string Error    = 2;
    Point Location  = 3;
    Direction Direction  = 4;
}
//移动广播 S2C_Move
message MovePush{
    int64 Uid = 1;
    Point Location = 2;
    Direction Direction  = 3;
}

//攻击 C2S_Attack
message AttackRequest{
    int32 SkillId  = 1;             //技能ID (必填)
    repeated int64 TargetUids = 2;  //目标Uids（普攻必填)
    Point Location = 3;             //中心（可选，默认使用攻击者坐标)
    Direction Direction =4;         //方向（可选，默认使用攻击者朝向)
}
message AttackResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32 SkillId   = 3;
    repeated int64 TargetUids  = 4;
    Point Location = 5;     //中心点
    Direction Direction =6; //方向
}
//攻击广播 S2C_Attack
message AttackPush{
    int64 AttackerId = 1;
    int32 SkillId    = 2;
    repeated int64 TargetUids = 3;
    Point Location = 4;     //中心点
    Direction Direction =5; //方向
}

//死亡 S2C_MonsterDie
message ObjectDiePush{
    int64 ObjectId = 1;
    int32 ReviveTimes = 2;  //复活次数
    bool  CanRevive = 3;    //能否复活
    int32 Countdown = 4;    //踢出副本倒计时（秒）
    bool  ReviveTip = 5;    //复活提示，false 不提示
}

//血量变化 S2C_HpChange
message ObjectHpChangePush{
    int64 TargetId      = 1; // 目标
    int64 AttackerId    = 2; // 源
    int32 ChangeHp      = 3; // 变化量
    int32 SkillId       = 4; // 技能
    bool Miss = 5;      // 闪避
    bool Critical = 6;  // 暴击
    int32 MaxHp = 7;
    bool Reflect = 8;  // 反伤
}

//怪物加入  S2C_MonsterIn
message MonsterInPush{
    repeated  MonsterInfo  MonsterList= 1;
}

//怪物离开 S2C_MonsterOut
message MonsterOutPush{
    int64 MonsterId = 1;
}

//增加资源  S2C_AddSource
message AddSourcePush{
    repeated ItemInfo Item = 1;
    int32 Type = 2; // 道具来源 1新增， 2脱装备, 3获得即分解
}
//扣除资源  S2C_TakeSource
message TakeSourcePush{
    repeated ItemInfo Item = 1;
}

//获取包裹信息 C2S_GetBag
message GetBagRequest{}
message GetBagResponse{
    Bag ItemList = 1;
}

//使用道具 C2S_ItemUse
message ItemUseRequest{
    int64 ItemUid = 1;
    int32 Num = 2;
}
message ItemUseResponse{
    int32  Code     = 1;
    string Error    = 2;
    repeated ItemInfo ItemList = 3;
}

//销毁道具 C2S_ItemDestroy
message ItemDestroyRequest{
    int64 ItemUid = 1;
    int32 Num   = 2;
}
message ItemDestroyResponse{
    int32  Code     = 1;
    string Error    = 2;
    ItemInfo Item   = 3;
}

//批量分解 C2S_ItemDisassembly
message ItemDisassemblyRequest{
    repeated int64 ItemUids = 1;
}
message ItemDisassemblyResponse{
    int32  Code     = 1;
    string Error    = 2;
    repeated int64 ItemUids = 3;
}

//升级  S2C_LevelUp
message LevelUpPush{
    int32 NewLevel = 1;
    int64 Uid = 2;
}

// 技能冷却 S2C_SkillCooldown
message SkillCooldownPush{
    int32 CfgId = 1;
    int32 Delay = 2; //毫秒
}

//增加副本时间 C2S_InstanceTimeAdd
message InstanceTimeAddRequest {
    int32 EnergyNum = 1;  //花费体力数量
    bool  AutoBuy   = 2;  //自动续费
}
message InstanceTimeAddResponse{
    int32  Code         = 1;
    string Error        = 2;
    int32  InstanceTimeLeft = 3; //副本剩余时间
    bool   AutoBuy   = 4;        //自动续费
}

message InstanceTimeAddPush{
    int32  InstanceTimeLeft = 1; //副本剩余时间
}


// Buff列表 S2C_BuffList
message BuffListPush{
    repeated BuffInfo BuffList = 1;
}

// 添加buff S2C_AddBuff
message AddBuffPush{
    int64 TargetId = 1;
    BuffInfo Buff =2;
}

// 删除buff S2C_RemoveBuff
message RemoveBuffPush{
    int64 TargetId = 1;
    int32 BuffId   = 2;
}

//断线重连 加入房间 S2C_ReJoinDesk
message ReJoinDeskPush{
    TableInfo TableInfo = 1;
    Point Location = 2;
    Direction Direction = 3;
    int64 LeftTime = 6; // 剩余时间(秒)
}

//复活 C2S_Revive
message ReviveRequest {}
message ReviveResponse{
    int32  Code         = 1;
    string Error        = 2;
    Point Location = 3;
    Direction Direction = 4;
    int32 CurHp = 5;
}
// 复活 S2C_Revive
message RevivePush{
    int64 Uid = 1;
    Point Location = 2;
    Direction Direction = 3;
    int32 CurHp = 4;
}


//穿/脱装备 C2S_ChangeEquip
message ChangeEquipRequest {
    int32 OpType    = 1; // 1穿，2脱
    EquipSlot Slot  = 2;
    int64 ItemUid   = 3;
    int32 PartnerSlotId = 4; //伙伴槽位   0表示主角 . >0 伙伴
}

message ChangeEquipResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32 OpType    = 3;
    EquipSlot Slot  = 4;
    ItemInfo Item   = 5;
    ItemInfo OldItem   = 6;
    int32 PartnerSlotId = 7; //伙伴槽位   0表示主角 . >0 伙伴
}

// 接任务 S2C_TaskAccept
message TaskAcceptPush{
    TaskInfo task = 1;
}

// 删任务 S2C_TaskRemove
message TaskRemovePush{
    TaskInfo task = 1;
}

// 更新任务 S2C_TaskUpdate
message TaskUpdatePush{
    TaskInfo task = 1;
}

//完成任务 C2S_TaskComplate
message TaskComplateRequest{
    int32 TaskId = 1;
}
message TaskComplateResponse{
    int32  Code     = 1;
    string Error    = 2;
}

// pvp匹配 C2S_MatchingRequest
message MatchingRequest{
    MatchType MatchType  =1;
    bool  Cancel       =2; // true取消匹配
}
message MatchingResponse{
    int32  Code     = 1;
    string Error    = 2;
    bool  Cancel    = 3; // true取消匹配
    MatchType MatchType  =4;
}
// 匹配结果 S2C_MatchingResult
message MatchingResultPush{
    int32  Status      = 1; //0匹配成功，1匹配中，2匹配失败
    repeated  PlayerInfo Players   = 2;
}
// 准备 C2S_MatchingReady
message MatchingReadyNotify{
}
// 比赛开始 S2C_MatchingStart
message MatchingStartPush{
}

// 加入比赛房间 S2C_MatchRoomJoin
message MatchRoomJoinPush{
    int32 		RoomCfgId   = 1; 	//房间配表ID
	int64 		RoomUid     = 2; 	//房间唯一ID
    Point       Location    = 3;
    Direction   Direction   = 4;
}

// 游戏结算 1v1  S2C_GameResultMatch
message GameResultMatchPush{
   bool Win  = 1;
   repeated ItemInfo Items = 2;
   int32 Score = 3; //积分变化
}

message MeleeResult{
    PlayerInfo Player = 1;
    repeated ItemInfo Items = 2;
    int32  KillNum = 3;
}
// 游戏结算 混战  S2C_GameResultMatchMelee
message GameResultMatchMeleePush{
    repeated MeleeResult Result = 1;
}

// pvp信息 C2S_PVPInfoRequest
message PVPInfoRequest{
    MatchType MatchType  =1; //模式
}
message PVPInfoResponse{
    int32  Code             = 1;
    string Error            = 2;
    MatchType MatchType     = 3; //模式
    int32   DailyMatchTimes = 4; //今日一挑战次数
	int32	DailyBuyNum     = 5; //今日已购买次数
}

//== 新1v1匹配

// 匹配对手 C2S_PvpMatchingRequest
message PvpMatchingRequest{
    int32 MatchType  =1; //模式 1:单人挑战  2:回合制
}
message PvpMatchingResponse{
        message PVPPlayer{
        int64 Uid = 1;
        string Name = 2;
        int32 Level = 3;
        int32 Combat = 4;   // 战力
        int32 Score = 5;    // 积分
        int32 Rank = 6;     // 排名
        string Avatar = 7;  // 头像
        int32 Job = 8;    // 职业
        int32 Gender = 9; // 性别
    }
    int32  Code     = 1;
    string Error    = 2;
    repeated PVPPlayer Players = 3;
    int32 MatchType  =4; //模式 1:单人挑战  2:回合制
}


// pvp挑战 C2S_PVPChallengeRequest
message PVPChallengeRequest{
   int64 Uid = 1;
}
message PVPChallengeResponse{
    int32  Code     = 1;
    string Error    = 2;
}

// 新技能 S2C_NewSkill
message NewSkillPush{
    SkillInfo skill = 1;
    repeated int32 SkillsSlot = 2;
}

//角色改名 C2S_ChangeRoleName
message ChangeRoleNameRequest{
    string RoleName = 1;
}
message ChangeRoleNameResponse{
    int32  Code     = 1;
    string Error    = 2;
    string RoleName = 3;
}
//强化C2S_Enhance
message EnhanceRequest{
    EquipSlot Slot = 1;
    int32 PartnerSlotId = 2; //伙伴槽位   0表示主角 . 1234 伙伴
}
message EnhanceResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32  NewLevel = 3; //强化之后的等级
    EquipSlot  Slot = 4; //部位
    int32 PartnerSlotId = 5; //伙伴槽位   0表示主角 . 1234 伙伴
}
//增幅C2S_Stars
message StarsRequest{
    EquipSlot Slot = 1;
    int32 PartnerSlotId = 2; //伙伴槽位   0表示主角 . 1234 伙伴
}
message StarsResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32  NewLevel = 3; //强化之后的等级
    EquipSlot  Slot = 4; //部位
    int32 PartnerSlotId = 5; //伙伴槽位   0表示主角 . 1234 伙伴
}
//增幅C2S_StarsLevel
message StarsLevelRequest{
    int64 ItemUId = 1;
    int32 Num = 2;
}
message StarsLevelResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32  NewLevel = 3; //强化之后的等级
    EquipSlot  Slot = 4; //部位
}
//洗炼 C2S_EquipRefine
message EquipRefineRequest{
    int64 ItemUid   = 1;
    Attribute Attr  = 2; //洗炼属性类型
    bool Random     = 3; //true随机洗炼 ,false 定向洗炼
}
message EquipRefineResponse{
    int32  Code     = 1;
    string Error    = 2;
    Stats  NewStats = 3; //新的属性
}

 //保留洗炼属性 C2S_EquipRefineReplace
message  EquipRefineReplaceRequest{
    bool Replace = 1;  //true 保留
}
message  EquipRefineReplaceResponse{
    int32  Code     = 1;
    string Error    = 2;
    ItemInfo Item   = 3;
}

// 聊天  C2S_Chat
message ChatRequest{
    ChatType Type = 1;
    string   Context = 2;
}

message ChatResponse{
    int32  Code     = 1;
    string Error    = 2;
}
// S2C_Chat
message ChatPush{
    ChatType Type = 1;
    string   Context = 2;
    int64    Uid = 3;
    string   Name = 4;
}

//穿/脱装备 C2S_SkillChange
message SkillChangeRequest {
    int32 OpType    = 1; // 1穿，2脱
    SkillsSlot Slot  = 2; //
    int32 SkillId   = 3;
}
message SkillChangeResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32 OpType    = 3;
    int32 SkillId = 4;
    SkillsSlot Slot  = 5;
}
//技能C2S_SkillUpgrade
message SkillUpgradeRequest{
    int32 SkillId = 1;
    int64 PartnerUid = 2; //伙伴Uid
}
message SkillUpgradeResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32 NewSkillId = 3; //升级之后的uuid
    int32 OldSkillId = 4;
    int64 PartnerUid = 5; //伙伴Uid
}
//技能C2S_SkillAdvanced
message SkillAdvancedRequest{
    int32 SkillId = 1;
    int64 PartnerUid = 2; //伙伴Uid
}
message SkillAdvancedResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32 OldSkillId =3;
    int32 NewLevel = 4; //升级之后的进阶等级
    int64 PartnerUid = 5; //伙伴Uid
}

// 游戏结算 爬塔 S2C_GameResultEndlesstrials
message GameResultEndlesstrialsPush{
    bool Win = 1;
    int32 Layer = 2; //当前挑战完成的层数
    repeated ItemInfo Items = 3;
}

//爬塔离线奖励 预览/领取 C2S_EndlesstrialsReward
message EndlesstrialsRewardRequest{
    int32 Type = 1;  // 1预览 ,2领奖
}
message EndlesstrialsRewardResponse{
    int32  Code     = 1;
    string Error    = 2;
    bool   Ready    = 3; //是否可以领取
    repeated ItemInfo Reward = 4; //预览可领取奖励
    int32  Layers     = 5; //当前挑战完成的层数
}

//死亡 S2C_ItemDrop
message ItemDropPush{
    int64 ObjectId = 1;
    Point Location = 2;
    repeated ItemInfo Items = 3;
}

//添加实例  S2C_GameObjectAdd
message GameObjectAddPush{
    ObjectInfo Info = 1;
}

//删除实例  S2C_GameObjectDel
message GameObjectDelPush{
    ObjectInfo Info = 1;
}

message KillInfo{
    int64 Uid = 1;
    string Name = 2;
    int32 Num = 3; //击杀数量
}
//混战击杀排行 S2C_PVPMeleeKill
message PVPMeleeKillNumPush{
    repeated KillInfo List = 1;
}

// 传送 S2C_Teleport
message TeleportPush{
    int64        Uid = 1;
    Point    	 Location = 2;
	Direction 	 Direction = 3;
    TeleportType Type = 4;
}

enum Notification{
    INVALID_Notification = 0;
    NEW_MAIL = 1;
    MAIL_FULL = 2; //邮件已满
    BAG_FULL = 3;  //包裹已满
}
// 系统通知 S2C_SystemNotification
message SystemNotificationPush{
    Notification Type = 1;
}
//CmdId_C2S_Compose
message ComposeRequest{
    repeated ComposeInfo Info = 1;
}
message ComposeResponse{
    int32  Code     = 1;
    string Error    = 2;
    repeated ComposeInfo NewConpose = 3; //合成之后的道具id
}

// 查看boss信息  C2S_CheckBoss
message CheckBossRequest{
    int32 BossCfgId = 1; // 世界boss配置ID
}
message CheckBossResponse{
    int32 Hp = 1; // 世界boss剩余血量
    int32 Challengetime = 2; // 已经挑战次数
}
//穿/脱宝石 CmdId_C2S_GemstoneChange
message GemstoneChangeRequest {
    int32 OpType    = 1; // 1穿，2脱
    EquipSlot Slot  = 2;
    GemstoneSlot GemstoneSlot  = 3; //
    int32 ItemUid   = 4;
    int32 PartnerSlotId = 5; //伙伴槽位   0表示主角 . 1234 伙伴
}
message GemstoneChangeResponse{
    int32  Code     = 1;
    string Error    = 2;
    int32 OpType    = 3;
    EquipSlot Slot  = 4;
    GemstoneSlot GemstoneSlot  = 5;
    int32 ItemUid   = 6;
    int32 PartnerSlotId = 7; //伙伴槽位   0表示主角 . 1234 伙伴
    // ItemInfo Item   = 6;
}

// 游戏结算 每日必做 S2C_GameResultDailyMap
message GameResultDailyMapPush{
    int32 RoomId = 1;
    repeated ItemInfo Items = 2;
}
// 双倍领取 C2S_DoubleReward
message DoubleRewardRequest{
    bool Double = 1;
}
message DoubleRewardResponse{
    int32  Code     = 1;
    string Error    = 2;
}
// 扫荡 C2S_CopySweep
message CopySweepRequest{
    int32 RoomId = 1;
    int32 BattleId = 2; //battle 表ID
    int32 SweepTimes = 3; //扫荡次数
}
message CopySweepResponse{
    int32  Code     = 1;
    string Error    = 2;
}
// 一键镶嵌穿/脱宝石 CmdId_C2S_GemstoneChangeAll
message GemstoneChangeAllRequest {
    int32 OpType    = 1; // 1穿，2脱
    EquipSlot Slot  = 2;
    int32 PartnerSlotId = 3; //伙伴槽位   0表示主角 . 1234 伙伴
}
message GemstoneChangeAllResponse{
    int32  Code     = 1;
    string Error    = 2;
    EquipSlot Slot  = 4;
    repeated int32 GemStoneSlot  = 5;
    int32 PartnerSlotId = 6; //伙伴槽位   0表示主角 . 1234 伙伴
}

// 挖矿 C2S_Mining
message MiningRequest{
    int64 Uid = 1;     //目标Uid
}
message MiningResponse{
    int32  Code     = 1;
    string Error    = 2;
}

// 评分
message DailyMapScorePush{
    MapType  MType = 1;
    int64    TotalDamage = 2;
    string   Scoring = 3;   //评价(经验副本,金币副本)
    int32    Round = 4;     //波次(强化石副本,书页副本)
    int32    MonsterNum = 5;     //每波怪总个数
}

// 每日副本挑战次数  C2S_DailyMapInfo
message DailyMapInfoRequest{}

message ChallengeInfo{
    MapType  MType = 1;
    int32    Times = 2;
}
message DailyMapInfoResponse{
    int32  Code     = 1;
    string Error    = 2;
    repeated ChallengeInfo Info = 3;
}

// 跑马灯 S2C_Lamp
message LampPush{
    int32 Uid = 1; //跑马灯配置ID
    repeated  string   Context = 2; //跑马灯内容
