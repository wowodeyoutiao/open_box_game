	WEEKLY 	= 2;     // 周常任务
	ACHIEVEMENT = 3; // 成就任务
	ROUTINE = 4;    // 日常任务
	DAILY_ACTIVITY = 5;    // 日活跃
	WEEKLY_ACTIVITY = 6;    // 周活跃
	MAINLINE = 7; // 主线任务
	VIP = 8;//VIP任务
	SEVENDAY=9;//开服七天乐
	SEVENDAY_ACTIVITY=10;//开服七天乐活跃
}

