	PVE_PEACEFUL_MAP = 1; // 代表PVE玩法中的和平模式地图
	PVE_WAR_MAP = 2;      // 代表PVE玩法中的战争模式地图
	PVP_ONE_ON_ONE_MAP = 3; // 代表PVP玩法中的1对1模式地图
	PVP_MULTI_ON_MULTI_MAP = 4; // 代表PVP玩法中的多对多模式地图
	SOLO_TOWER_MAP = 5; // 代表个人爬塔类玩法地图
	WORLD_BOSS_MAP = 6; // 世界boss
	EXPERIENCE_FB_MAP = 7; // 代表经验副本
	GOLD_FB_MAP = 8; // 代表金币副本
	ENHANCE_STONE_FB_MAP = 9; // 代表强化石副本
	BOOK_PAGE_FB_MAP = 10; // 代表书页副本
	STAR_UP_STONE_FB_MAP = 11; // 代表升星石副本
	SOUL_STONE_FB_MAP = 12; // 代表魂石副本
	GUIDANCE_FB_MAP = 13; //  代表新手引导
    BATTLE_MAP = 14; // 战役（主线）副本
    BOSS_MAP = 15; // 首领副本
    TRIAL_TOWER_MAP = 16; // 试炼塔
    RELIC_MAP = 17; // 遗迹
  }

 // 伙伴信息
message PartnerInfo{
    int64 Uid = 1;  //唯一id
    int32 CfgId = 2;  //configid
    int32 Level = 3;
    int32 Star = 5;
    repeated SkillInfo Skills = 6;
}
message PartnerSlotInfo{
    int32 SlotId = 1;
	int64 PartnerUid = 2;
	repeated SlotInfo Equips = 3; //穿戴装备,未穿槽位null
}
message Userbox{
	int32 Nowlevel = 1; //当前等级
	repeated ItemInfo NowOpenRes = 2;//当前开启的物品
	int64 NextBoxRecoveryTime    = 3; //剩余升级宝箱时间
	int32 NowOpenLevel = 4; //当前开启的宝箱等级
	int32 Job =5 ; //职业
}
 // 宠物信息
 message PetSlotInfo{
    int64 Uid = 1;  //唯一id
    int32 CfgId = 2;  //configid
    int32 Level = 3;
    int32 Star = 4;
    int32 Exp = 5;
	int32 Enhance = 6;
	int32 Quality = 7;
	int32 Skill = 8;
    int32 ExpStar = 9;
}

enum GameOverType {
	GameOverType_UNSPECIFIED = 0; // 未指定
	GameOverTypeTime = 1;         // 时间到
	GameOverTypePDead = 2;        // 死亡复活超时
	GameOverTypeMDead = 3;        // 怪死光
	GameOverTypeDeadFaild = 4;    // 死亡失败
	GameOverTypeCopySweep = 5;    // 扫荡结果
}
// 工会信息
message GuildInfo {
	int64 Id = 1; // 工会ID
	string Name = 2; // 工会名称
	string Description = 3; // 工会描述
	int32 Level = 4; // 工会等级
	int32 MemberCount = 5; // 成员数量
	int32 MaxMembers = 6; // 最大成员数量
	int64 LeaderId = 7; // 会长ID
	string LeaderName = 8; // 会长名称
	int64 CreatedAt = 9; // 创建时间
	int32 Application = 10; // 是否申请 0：加入工会 1:  已申请 2: 未申请
	int64 GuildExp = 11;	// 工会经验
	repeated GuildSkillInfo Skills = 12;
}

//技能列表
message GuildSkillInfo {
	int32 CfgId = 1; // 技能ID
	int32 Level = 2; // 技能等级
	int32 Exp = 3; // 技能经验
}

// 工会申请信息
message GuildApplyInfo {
	int64 ApplicantId = 1; // 申请者ID
	string ApplicantName = 2; // 申请者名称
	int32 ApplicantLevel = 3; // 申请者等级
	int64 ApplyTime = 4; // 申请时间
	int32 ApplicantTotalCombat = 5;//申请者战斗力
}

// 工会成员信息
message GuildMemberInfo {
	int64 MemberId = 1; // 成员ID
	string MemberName = 2; // 成员名称
	int32 MemberLevel = 3; // 成员等级
	int32 Position = 4; // 成员职位 1会长 2管理员 3成员
	int64 JoinTime = 5; // 加入时间
	int32 MemberTotalCombat = 6; // 成员战斗力
	int32 MemberOnline = 7; // 成员最后登录时间，在线为0
	int32 Points = 8; // 成员贡献度
}
// 工会商店购买信息
message GuildShopBuyInfo {
    int32 ItemId = 1; // 商品ID
    int32 BuyNum = 2; // 自己购买数量
    int32 TotalNum = 3; // 工会总购买数量
}
// 观察玩家信息
message ObservePlayerInfo {
	message PartnerStats{
        int32       Combat = 1; // 战斗力
    	repeated Stats Attributes = 2;
        int64 PartnerUid = 3; // 伙伴Uid
    }
    int32       TotalCombat = 1; // 总战斗力
    int32       Combat = 2; // 主角战斗力
    repeated Stats Attributes = 3; //主角属性
    repeated PartnerStats PartnersStats = 4; //伙伴属性
	repeated SlotInfo SlotInfo = 5; //装备槽位信息
	PetSlotInfo Pets = 6;	//上阵宠物信息
	repeated PartnerSlotInfo Partners = 7;	//伙伴信息
	int32 VipLevel = 8; //vip等级
	int32 Job = 9; //职业
	int32 Level = 10; //等级
	int32 Sex = 11; //性别
    string Nickname = 12; //昵称
	repeated PartnerInfo PartnerInfo = 13; //伙伴信息

}

message ChatHistory  {
	int64 Uid = 1;    // 发送者UID
	string Name = 2;  // 发送者昵称
	string Msg = 3;   // 消息内容
	int64 Time = 4;   // 发送时间
}
