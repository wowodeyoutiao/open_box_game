message EmptyMessage{}


enum Direction {
	// 向上方向
	UP = 0;
	// 向上且向右方向
	UP_RIGHT = 1;
	// 向右方向
	RIGHT = 2;
	// 向下且向右方向
	DOWN_RIGHT = 3;
	// 向下方向
	DOWN = 4;
	// 向下且向左方向
	DOWN_LEFT = 5;
	// 向左方向
	LEFT = 6;
	// 向上且向左方向
	UP_LEFT = 7;
	// 无方向，通常用作默认值或无效值
	NONE = 255;
}

//坐标
message Point{
	double X = 1;
	double Y = 2;
}

// 属性
message Stats{
	Attribute attr = 1;  // 枚举
	int32 	Num = 2;     // 值
}

//通用键值对
message KeyValue{
	int32 K = 1;
	int32 V = 2;
}

//角色战斗属性
enum Attribute {
	INVALID_Attribute = 0;

	PHYSICAL_ATTACK 	= 1;	// 物理攻击
	MAGIC_ATTACK 		= 2;	// 魔法攻击
	HEALTH 				= 3;	// 生命值
	PHYSICAL_DEFENSE 	= 4;	// 物理防御
	MAGIC_DEFENSE 		= 5;	// 魔法防御
	DODGE 				= 6;	// 闪避值
	HIT 				= 7;	// 命中值
	CRITICAL_STRIKE 	= 8;	// 暴击值
	TOUGHNESS 			= 9;	// 韧性值
	ATTACK_SPEED 		= 10;	// 攻击速度(毫秒)
	MOVE_SPEED 			= 11;	// 移动速度(毫秒)
	MAX_HEALTH 			= 12;	// 最大生命值
	PHYSICAL_ATTACK_PERCENTAGE 			= 13;  	// 物理攻击百分比加成
	MAGIC_ATTACK_PERCENTAGE 			= 14;  	// 魔法攻击百分比加成
	HEALTH_PERCENTAGE 					= 15;  	// 生命值百分比加成
	PHYSICAL_DEFENSE_PERCENTAGE 		= 16;  	// 物理防御百分比加成
	MAGIC_DEFENSE_PERCENTAGE 			= 17;  	// 魔法防御百分比加成
	DODGE_PERCENTAGE 					= 18;  	// 闪避值百分比加成
	HIT_PERCENTAGE 						= 19;  	// 命中值百分比加成
	CRITICAL_STRIKE_PERCENTAGE 			= 20;  	// 暴击值百分比加成
	TOUGHNESS_PERCENTAGE 				= 21;  	// 韧性值百分比加成
	ATTACK_SPEED_PERCENTAGE 			= 22;  	// 攻击速度百分比加成
	MOVE_SPEED_PERCENTAGE 				= 23;  	// 移动速度百分比加成
	CRITICAL_DAMAGE_PERCENTAGE 			= 24;  	// 暴击伤害百分比加成
	PVP_DAMAGE_PERCENTAGE 				= 25; 	// 对人增伤百分比加成
	PVE_DAMAGE_PERCENTAGE 				= 26; 	// 对怪增伤百分比加成
	EXP_INCREASE_PERCENTAGE 			= 27; 	// 杀怪经验百分比加成
    ENERGY_RECOVERY_SPEED_PERCENTAGE 	= 28; 	// 体力值回复速度百分比加成
    ITEM_DROP_RATE_PERCENTAGE 		 	= 29; 	// 物品爆率百分比加成
	DMT_REDUCE_FIXED_PLAYER  			= 30;	// 对人减伤固定值
	DMT_REDUCE_FIXED_MONSTER  			= 31; 	// 对怪减伤固定值
	DMT_REDUCE_PERCENTAGE_PLAYER  		= 32;	// 对人减伤百分比
	DMT_REDUCE_PERCENTAGE_MONSTER  		= 33; 	// 对怪减伤百分比
	DMT_FINAL_REDUCE_FIXED  			= 34; 	// 最终减伤固定值
	DMT_FINAL_REDUCE_PERCENTAGE  		= 35; 	// 最终减伤百分比
 	DMT_INCREASE_FIXED_PLAYER  			= 36; 	// 对人增伤的固定值
 	DMT_INCREASE_FIXED_MONSTER  		= 37; 	// 对怪增伤的固定值
 	DMT_FINAL_INCREASE_FIXED  			= 38; 	// 最终增伤固定值
 	DMT_FINAL_INCREASE_PERCENTAGE  		= 39; 	// 最终增伤百分比
 	SUCKING_BLOOD_PERCENTAGE  			= 40; 	// 吸血百分比
 	REDUCE_CONTROL_TIME_PERCENTAGE  	= 41; 	// 减控时间百分比
	REFLECT_DAMAGE_PERCENTAGE  			= 42; 	// 反伤百分比
	LIFE_RECOVERY_INCREASE_PERCENTAGE   = 43;   // 生命恢复增加百分比
    LIFE_RECOVERY_DECREASE_PERCENTAGE   = 44;   // 生命恢复减少百分比
    DAMAGE_CONVERT_PERCENTAGE    		= 45;   // 伤害转化百分比
	DAMAGE_ABSORB_PERCENTAGE 			= 46;   // 伤害吸收百分比
 	CONTROL_TIME_REDUCTION_PERCENTAGE 	= 47; 	// 受控时间减少百分比(针对Skilltype: 4或5的技能)
 	CONTROL_TIME_REDUCTION_FIXED_VALUE 	= 48; 	// 受控时间减少固定值(毫秒)(针对Skilltype: 4或5的技能)
 	CONTROL_DAMAGE_REDUCTION_PERCENTAGE = 49; 	// 受控伤害减少百分比(针对Skilltype: 4或5的技能)
 	CONTROL_DAMAGE_REDUCTION_FIXED_VALUE= 50; 	// 受控伤害减少固定值(针对Skilltype: 4或5的技能)
	WEAPON_ATTACK_PERCENTAGE 			= 51; 	// 武器百分比攻击力的效果


 	EQUIP_STAR_PERCENTAGE  				= 500; 	// 装备升星几率

	MAX_Attribute = 501;
}

// 属性来源
enum AttrSource {
	INVALID_AttrSource = 0;
	STRENGTHEN	= 1; //强化
}


enum DeskStatus {
	INVALID_DeskStatus = 0; // 未知状态
    DESK_STATUS_CREATE = 1; // 创建桌子
    DESK_STATUS_PLAYING = 2; // 游戏中
    DESK_STATUS_IDLE = 3; // 已经清理，即为下一轮准备好
    DESK_STATUS_DESTROY = 4; // 已销毁
}

// 房间信息
message RoomInfo{
	int32 RoomId = 1; 		//房间ID
	string Name = 2;		//房间名字
	int32 GameType = 3; 	//游戏类型
	int32 MinEntryLimit = 4; // 最低进入限制
	int32 MaxEntryLimit = 5; // 最高进入限制
	int32 PlayerNum = 6;
}

//桌子信息
message TableInfo {
	int32 		RoomCfgId = 1; 	//房间配表ID
	int64 		RoomUid = 2; 	//房间唯一ID
	repeated  MonsterInfo  MonsterList= 3; //房间内怪物列表
	int32 		BattleId = 4; //战斗ID
}

//实例类型
enum ObjectType{
	INVALID_ObjectType  = 0;
	PLAYER   = 1;
	PARTNER  = 2; //伙伴
	MONSTER  = 3;
	ROBOT    = 4;
	BUFF     = 5;
	DECOY    = 6; //替身
}
//通用实例
message ObjectInfo{
	ObjectType  Type 		= 1;
	int64    	Uid         = 2;
	int32	 	CfgID 		= 3;
	int32  		Level 		= 4;
	string   	Name		= 5;
	Point    	Location    = 6;
	Direction 	Direction 	= 7;
	int32 		MaxHp 		= 8;
	int32   	CurHp 		= 9;
	int64  		OwnerUid 	= 10; //主人Uid
	repeated BuffInfo BuffList 	= 11;
	repeated Stats Attributes 	= 12;
}

//玩家简明信息
message PlayerInfo{
	int64    Uid            = 1;
	string   Nickname       = 2;
	string   HeadUrl        = 3;
	Point    Location       = 4;
	Direction Direction 	= 5;
	int32  	Level 	= 6;
	int32  	Job 	= 7;  //1战， 2法， 3祭
	int32 	MaxHp 	= 8;
	int32   CurHp 	= 9;
	int32  	Gender 	= 10;
	repeated BuffInfo BuffList 	= 11;
	int32  	FateLevel 	= 12;
	int32  	FateExp 	= 13;
	repeated ObjectInfo PartnerList 	= 14; //伙伴列表
}

 // 伙伴信息
 message PartnerSceneInfo{
    int64 Uid = 1;  //唯一id
    int32 CfgId = 2;  //configid
    int32 Level = 3;
    int32 Star = 4;
	Point    Location       = 5;
	Direction Direction 	= 6;
	int32 	MaxHp 	= 7;
	int32   CurHp 	= 8;
	int64  OwnerUid = 9; //主人Uid
	repeated BuffInfo BuffList 	= 10;
}

//怪物信息
message MonsterInfo{
	int32    	CfgId			= 1;  	//配置ID
	int64    	Uid            	= 2;  	//唯一ID
	string   	Name       		= 3;
	int32    	MaxHp     	    = 4;	//最大血量
	int32    	CurHp     	    = 5;	//当前血量
	Point    	Location       	= 6;	//位置
	Direction 	Direction  		= 7;	//朝向
	repeated BuffInfo BuffList 	= 8;
}
 // 宠物信息
 message PetSceneInfo{
    int64 Uid = 1;  //唯一id
    int32 CfgId = 2;  //configid
    int32 Level = 3;
    int32 Star = 4;
	int64  OwnerUid = 5; //主人Uid
	repeated BuffInfo BuffList 	= 6;
}
// 装备信息
message EquipInfo{
	repeated Stats Attributes = 1;
	ItemQuality 	Quality = 2; // 品质
}

// 定义道具种类的枚举
enum ItemType {
	// 代表不进入包裹的数值类道具
	NOT_IN_BAG = 0;
	// 代表进入包裹且可被销毁的道具
	IN_BAG_DISPOSABLE = 1;
	// 代表进入包裹且可被销毁和使用的道具
	IN_BAG_DISPOSABLE_AND_USABLE = 2;
	// 代表进入包裹、可被销毁、带有时效的道具
	IN_BAG_TIME_LIMITED = 3;
	// 代表进入包裹、可被销毁和使用、带有时效的道具
	IN_BAG_DISPOSABLE_USABLE_TIME_LIMITED = 4;
	// 代表装备类，该类道具可装备、可分解
	EQUIPMENT = 5;
}

// 道具品质
enum ItemQuality {
    INVALID_Quality = 0;
    WHITE 	= 1; 	// 1 代表白色品质
    GREEN 	= 2; 	// 2 代表绿色品质
    BLUE 	= 3;  	// 3 代表蓝色品质
    PURPLE 	= 4;	// 4 代表紫色品质
    PINK 	= 5;	// 5 代表粉色品质
    ORANGE 	= 6;	// 6 代表橙色品质
    RED 	= 7;	// 7 代表红色品质
	Rainbow = 8;	// 8 代表彩虹品质
}

// 道具信息
message ItemInfo{
	int32   	CfgId		= 1;  //配置ID
	int64 		Uid 		= 2;
	int64   	Num     	= 3;
	int64   	CreateTime 	= 4;
	ItemType 	Type 		= 5;  //道具类型
	EquipInfo 	Equip 		= 6;  //装备属性
}

message Bag{
	repeated ItemInfo ItemList = 1;
}


enum EquipSlot{
	INVALID_EquipSlot 	 =0;
	Weapon        	     =1;  // 1: 代表武器
	Clothes              =2;  // 2: 代表衣服
	Helmet               =3;  // 3: 代表头盔
	Necklace             =4;  // 4: 代表项链
	LeftRing             =5;  // 5: 代表左戒指
	RightRing            =6;  // 6: 代表右戒指
	LeftBracelet         =7;  // 7: 代表左手镯
	RightBracelet        =8;  // 8: 代表右手镯
	Belt                 =9;  // 9: 代表腰带
	Boots                =10; // 10: 代表靴子
	Greaves              =11; // 11: 代表护腿
	Pendant				 =12; // 12: 代表玉佩
	MaxEquipSlot	     =13;
}
enum SkillsSlot{
	INVALID_SkillsSlot	 =0;
	MaxSkillsSlot	     =13;
}
enum PetsSlot{
	INVALID_PetsSlot	 =0;
	MaxPetsSlot	     =21;
}
// 槽位:装备、强化、升星
message SlotInfo{
	ItemInfo Item 	= 1;
	int32	Enhance = 2; // 强化等级
	int32 	Stars 	= 3; // 升星等级
	repeated int32 	Gemstone 	= 4; //宝石
}
enum GemstoneSlot{
	INVALID_GemstoneSlot	 =0;
	MaxGemstoneSlot	     =4;
}

//任务分类
enum TaskClass {
