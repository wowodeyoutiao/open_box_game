services:
  redis:
    image: redis:7.4
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data:rw
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 3
      start_period: 10s

  mysql:
    container_name: mysql
    image: mysql:8.4
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-game_mow}
      MYSQL_USER: ${MYSQL_USER:-mow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mow123456}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --slow-query-log=1
      --long-query-time=3
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-mysql}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nanoserver:
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: nanoserver
    restart: always
    depends_on:
      - redis
      - mysql
    ports:
      - "12307:12307"
      - "7000:7000"
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs:rw

  # nanoserver:
  #   image: nanoserver:latest
  #   container_name: nanoserver
  #   restart: always
  #   depends_on:
  #     - redis
  #     - mysql
  #   ports:
  #     - "12307:12307"
  #     - "12308:12308"
  #   # environment:
  #   #   REDIS_ADDR: redis:6379
  #   #   MYSQL_ADDR: mysql:3306
  #   #   MYSQL_USER: ${MYSQL_USER:-mow}
  #   #   MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mow123456}
  #   #   MYSQL_DATABASE: ${MYSQL_DATABASE:-game_mow}
  #   volumes:
  #     - ./configs:/app/configs:ro
  #     - ./logs:/app/logs:rw

volumes:
  redis_data:
    driver: local
  mysql_data:
    driver: local

networks:
  default:
    name: nanoserver_network
    driver: bridge
