[core]
# enable debug mode
debug = true
heartbeat = 30
server_id = 1 # 为了代码兼容暂时留着, 下面的生效后这个可以去除
server_id_range_start = 1  #服务器唯一ID[start, end)
# 单机版：只有一个服，合法区间 [1, 2)
# ⚠️ 原值 1101 是历史 1100 服运营配置，会让机器人/世界BOSS 按 1100 倍初始化（77 万个假玩家 ≈ 8GB 堆）导致整机卡死
server_id_range_end = 2
open_gm = true
env= "test" # dev本地、test测试、stag 预发布、prod正式

#WEB服务器设置
[webserver]
addr = "0.0.0.0:12307"                         #监听地址
enable_ssl = false                            #是否使用https, 如果为true, 则必须配置cert和key的路径
static_dir = "web/static"

#证书设置
[webserver.certificates]
#cert = ""       #证书路径
#key = ""        #Key路径

[game-server]
host = "127.0.0.1"
port = 7000
listen_port = 7000

# Redis server config
[redis]
host = "127.0.0.1"
port = 6379
auth = ""
max_idle = 10
max_active = 1000
idle_timeout = 60
index_db = 1
conn_fail_retry_times = 3
reconnect_interval = 1

# Mysql server config
[database]
host = "127.0.0.1"
port = 3306
dbname = "game_mow"
password = "01478520.369"
username = "root"
args = "charset=utf8mb4"
buf_size = 10
max_idle_conns = 20
max_open_conns = 15
show_sql = false

# 微信
