[program:game01]
command=/data/projiect/nanoserver/mowserver
directory=/data/projiect/nanoserver
;user=appuser
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/game01.log
stderr_logfile=/var/log/supervisor/game01-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
;environment=GO_ENV="production",PORT="8080"