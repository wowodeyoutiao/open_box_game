server {
    listen 80 ;

    # SSL configuration
    #
    # listen 443 ssl default_server;
    # listen [::]:443 ssl default_server;
    #
    # Note: You should disable gzip for SSL traffic.
    # See: https://bugs.debian.org/773332
    #
    # Read up on ssl_ciphers to ensure a secure configuration.
    # See: https://bugs.debian.org/765782
    #
    # Self signed certs generated by the ssl-cert package
    # Don't use them in a production server!
    #
    # include snippets/snakeoil.conf;

    root /var/www/wly_icp;

    # Add index.php to the list if you are using PHP
    index index.html index.htm index.nginx-debian.html;

    server_name shbinqigame.com www.shbinqigame.com bq.sunfeiyang.com;

    location / {
        # First attempt to serve request as file, then
        # as directory, then fall back to displaying a 404.
        try_files $uri $uri/ =404;
    }

    # pass PHP scripts to FastCGI server
    #
    #location ~ \.php$ {
    #       include snippets/fastcgi-php.conf;
    #
    #       # With php-fpm (or other unix sockets):
    #       fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    #       # With php-cgi (or other tcp sockets):
    #       fastcgi_pass 127.0.0.1:9000;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #       deny all;
    #}
}

server {
    listen 12307 ssl http2; # 监听 443 端口，启用 HTTPS 和 HTTP/2
    server_name shbinqigame.com www.shbinqigame.com 101.132.113.17; # 替换为你的域名

    # SSL 证书和私钥路径
    ssl_certificate /etc/nginx/key/shbinqigame.com.pem; # SSL 证书路径
    ssl_certificate_key /etc/nginx/key/shbinqigame.com.key; # SSL 私钥路径

    # SSL 配置
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3; # 推荐使用较新的 TLS 协议[^7^][^10^]
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; # 强制使用高强度加密[^8^][^12^]
    ssl_prefer_server_ciphers on;

    # 错误页面配置
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # 访问日志和错误日志
    access_log /var/www/12308/access.log; # 替换为你的访问日志路径[^8^]
    error_log /var/www/12308/error.log warn; # 替换为你的错误日志路径[^8^]

    location / {
        proxy_pass http://127.0.0.1:12308;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 设置超时时间
        #proxy_connect_timeout 60s;
        #proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2; # 监听 443 端口，启用 HTTPS 和 HTTP/2
    server_name shbinqigame.com www.shbinqigame.com 101.132.113.17; # 替换为你的域名

    # SSL 证书和私钥路径
    ssl_certificate /etc/nginx/key/shbinqigame.com.pem; # SSL 证书路径
    ssl_certificate_key /etc/nginx/key/shbinqigame.com.key; # SSL 私钥路径

    # SSL 配置
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3; # 推荐使用较新的 TLS 协议[^7^][^10^]
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; # 强制使用高强度加密[^8^][^12^]
    ssl_prefer_server_ciphers on;

    # 网站根目录
    root /var/www/wly_icp; # 替换为你的网站根目录
    index index.html index.htm;

    # 错误页面配置
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # 访问日志和错误日志
    access_log /var/www/wly_icp/access.log; # 替换为你的访问日志路径[^8^]
    error_log /var/www/wly_icp/error.log warn; # 替换为你的错误日志路径[^8^]

    location /v1/order/wx/ {
        # 转发到后端服务器
        proxy_pass http://127.0.0.1:12308;


        # 设置代理头部信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 可选：设置超时时间
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 可选：禁用缓存（适用于动态内容）
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

}
