server {
    listen 8080 ssl http2; #
    server_name shbinqigame.com www.shbinqigame.com ; # 替换为你的域名

    # SSL 证书和私钥路径
    ssl_certificate /etc/nginx/key/shbinqigame.com.pem; # SSL 证书路径
    ssl_certificate_key /etc/nginx/key/shbinqigame.com.key; # SSL 私钥路径

    # SSL 配置
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3; # 推荐使用较新的 TLS 协议[^7^][^10^]
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; # 强制使用高强度加密[^8^][^12^]
    ssl_prefer_server_ciphers on;

    location / {
        root /var/www/go-admin-ui;
        try_files $uri $uri/ /index.html; # 处理前端路由
    }
    # 配置后台go服务api接口服务 代理到8000端口
    location ~ ^/goadminapi/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/goadminapi/(.*)$ /$1 break;
        proxy_pass http://101.132.113.17:8000; #这里写自己的服务器的内网ip地址,不要写127.0.0.1
    }
    # 错误页面配置
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # 访问日志和错误日志
    access_log /var/www/wly_icp/access.log; # 替换为你的访问日志路径[^8^]
    error_log /var/www/wly_icp/error.log warn; # 替换为你的错误日志路径[^8^]
}
