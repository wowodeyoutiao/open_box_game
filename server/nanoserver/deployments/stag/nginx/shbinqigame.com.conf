server {
    listen 7000 ssl;
    server_name shbinqigame.com;

    ssl_certificate /etc/nginx/key/shbinqigame.com.pem; # SSL 证书路径
    ssl_certificate_key /etc/nginx/key/shbinqigame.com.key; # SSL 私钥路径

    access_log /var/log/nginx/shbinqiwangluo.com7000-access.log;
    error_log /var/log/nginx/shbinqiwangluo.com7000-error.log;

    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}