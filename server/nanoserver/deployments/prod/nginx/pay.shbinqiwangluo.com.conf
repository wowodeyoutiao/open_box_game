server {
  listen 80;
  server_name pay.shbinqiwangluo.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name pay.shbinqiwangluo.com;

  ssl_certificate /etc/nginx/certs/pay.shbinqiwangluo.com.pem;
  ssl_certificate_key /etc/nginx/certs/pay.shbinqiwangluo.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  access_log /var/log/nginx/pay.shbinqiwangluo.com-access.log;
  error_log /var/log/nginx/pay.shbinqiwangluo.com-error.log;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Static files with caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # API proxy
  # location /v1/order/wx/ {
  #   proxy_pass http://127.0.0.1:12307;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_connect_timeout 30s;
  #   proxy_send_timeout 30s;
  #   proxy_read_timeout 30s;
  # }

  location / {
    proxy_pass http://127.0.0.1:12307;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # Default location
  #location / {
  #  try_files $uri $uri/ /index.html;
  #}
}


server {
  listen 7000 ssl;
  server_name pay.shbinqiwangluo.com;

  ssl_certificate /etc/nginx/certs/pay.shbinqiwangluo.com.pem;
  ssl_certificate_key /etc/nginx/certs/pay.shbinqiwangluo.com.key;

  access_log /var/log/nginx/pay.shbinqiwangluo.com7000-access.log;
  error_log /var/log/nginx/pay.shbinqiwangluo.com7000-error.log;

  location / {
    proxy_pass http://127.0.0.1:7001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}